<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Lora 2026</title>
<style>
:root{
  --navy:#16325c; --navy2:#22477e; --ink:#1d2a1d; --row:#e3ecd2; --row2:#d8e4c3;
  --time:#1f8a3e; --page:#2a2a2a; --paper:#ffffff; --muted:#8aa0bd; --line:#9fb08a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:#eee;font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif}
.wrap{max-width:1300px;margin:0 auto;padding:16px}
.board{background:#111;border-radius:10px;padding:10px;overflow-x:auto}
.head{display:flex;flex-wrap:wrap;align-items:stretch;background:var(--paper);color:var(--navy)}
.clock{background:var(--navy);color:#fff;font-size:56px;font-weight:700;padding:6px 20px;letter-spacing:1px;min-width:190px;text-align:center}
.clock .sep{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}
.tabs{display:flex;align-items:center;gap:14px;padding:0 18px}
.tab{font-size:36px;font-weight:700;color:var(--muted);cursor:pointer;background:none;border:0;font-family:inherit;padding:0}
.tab.on{color:var(--navy)}
.sub{border-left:3px solid var(--navy);padding-left:10px;font-size:20px;letter-spacing:1px;white-space:nowrap}
.ctl{display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:wrap;margin-left:auto}
.ctl label{font-size:13px;font-weight:700;letter-spacing:1px}
select,input,button.btn{font:inherit;font-size:18px;border:2px solid var(--navy);border-radius:6px;padding:5px 10px;color:var(--navy);background:#fff}
button.btn{background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;background:var(--row)}
thead th{background:var(--paper);color:var(--navy);text-align:left;font-size:20px;padding:6px 10px 4px;line-height:1}
thead th small{display:block;font-size:11px;letter-spacing:1px;color:#58739a;font-weight:600}
tbody td{color:var(--ink);font-size:30px;font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
tbody tr:nth-child(even) td{background:var(--row2)}
td.t{background:var(--time)!important;color:#fff;text-align:center;width:120px}
td.dest{text-transform:uppercase;width:34%}
td.obs{font-size:22px;text-transform:uppercase;max-width:420px;overflow:hidden;text-overflow:ellipsis}
td.via{font-size:34px;font-weight:700;text-align:center;width:70px}
.badge{display:inline-block;min-width:150px;text-align:center;padding:4px 10px;border-radius:2px;font-size:24px;font-weight:700;text-transform:uppercase}
.paso td{opacity:.75}
.empty td{text-align:center;font-size:22px}
.note{font-size:14px;color:#ccc;margin:10px 4px}
details{margin:6px 4px}
summary{cursor:pointer;font-weight:700;color:#ddd}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:6px 18px;margin-top:8px}
.leg{display:flex;gap:8px;align-items:flex-start;font-size:15px;cursor:pointer}
.leg b.n{min-width:38px;text-align:center;border-radius:3px;padding:1px 4px}
.leg:hover{color:#fff}
.it{margin-top:16px}
.it h2{color:#fff;font-size:24px;margin:0 0 6px}
.it td{font-size:24px}
.it tr.pas td{opacity:.65;font-style:italic}
@media (max-width:700px){
  .clock{font-size:40px;min-width:130px}.tab{font-size:26px}.sub{display:none}
  tbody td{font-size:20px;padding:6px}.badge{min-width:80px;font-size:16px}td.t{width:70px}
  td.obs{font-size:15px;max-width:160px}.legend{grid-template-columns:1fr}
  #thead th:nth-child(5),#tbody td:nth-child(5),#thead th:nth-child(6),#tbody td:nth-child(6){display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="board">
    <div class="head">
      <div class="clock" id="clock">--<span class="sep">:</span>--</div>
      <div class="tabs">
        <button class="tab on" data-v="salidas">Salidas</button>
        <button class="tab" data-v="llegadas">Llegadas</button>
        <button class="tab" data-v="pasos">Pasos</button>
        <span class="sub" id="sub">DEPARTURES</span>
      </div>
      <div class="ctl">
        <label for="est">ESTACIÓN</label><select id="est"></select>
        <input type="time" id="hora" title="Hora simulada">
        <button class="btn" id="ahora">Ahora</button>
      </div>
    </div>
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p class="note" id="note"></p>
  <details open><summary>Leyenda de trenes (pulsa un tren para ver su itinerario)</summary><div class="legend" id="legend"></div></details>
  <div class="it" id="it"></div>
</div>

const badge = t => `<span class="badge" style="background:${t.color};color:${textColor(t.color)}">${t.tipo}</span>`;

// stop-only view of each train's cycle, for "destino / continúa / procedencia"
for (const t of DATA.trenes) t.paradas = t.eventos.filter(e => e.tipo === "parada");
function around(t, e) {
  const p = t.paradas, ev = t.eventos, i = ev.indexOf(e);
  // previous and following stops in cycle order, starting from event e
  const after = [], before = [];
  for (let k = 1; k < ev.length; k++) { const x = ev[(i + k) % ev.length]; if (x.tipo === "parada") after.push(x); }
  for (let k = 1; k < ev.length; k++) { const x = ev[(i - k + ev.length) % ev.length]; if (x.tipo === "parada") before.push(x); }
  return { after, before };
}

function rows(station, now) {
  const out = [];
  for (const t of DATA.trenes) for (const e of t.eventos) {
    if (e.estacion !== station) continue;
    const { after, before } = around(t, e);
    if (view === "pasos" && e.tipo === "paso")
      out.push({ at: nextAt(e.arr, now), t, e, a: before[0], b: after[0] });
    if (view !== "pasos" && e.tipo === "parada") {
      if (view === "salidas") {
        if (!after.length || after[0].estacion === station && after.length === 1) continue;
        out.push({ at: nextAt(e.dep, now), t, e, dest: after[0], cont: after.slice(1, 4) });
      } else {
        out.push({ at: nextAt(e.arr, now), t, e, orig: before[0] });
      }
    }
  }
  return out.sort((x, y) => x.at - y.at || x.t.numero - y.t.numero);
}

function render() {
  const now = nowMin(), station = $("#est").value;
  $("#clock").innerHTML = fmt(now).replace(":", '<span class="sep">:</span>');
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  $("#sub").textContent = { salidas: "DEPARTURES", llegadas: "ARRIVALS", pasos: "PASSING" }[view];
  const head = {
    salidas: ["Hora|TIME", "Destino|DESTINATION", "Tren|TRAIN", "Número|NUMBER", "Vía|PLATFORM", "Observaciones|OBSERVATIONS"],
    llegadas: ["Hora|TIME", "Procedencia|ORIGIN", "Tren|TRAIN", "Número|NUMBER", "Vía|PLATFORM", "Observaciones|OBSERVATIONS"],
    pasos: ["Hora|TIME", "De → a|FROM → TO", "Tren|TRAIN", "Número|NUMBER", "|", "Observaciones|OBSERVATIONS"],
  }[view];
  $("#thead").innerHTML = "<tr>" + head.map(h => { const [a, b] = h.split("|"); return `<th>${a}<small>${b}</small></th>`; }).join("") + "</tr>";
  const r = rows(station, now);
  $("#tbody").innerHTML = r.length ? r.map(x => {
    const via = x.e.via || "";
    let place, obs;
    if (view === "salidas") {
      place = x.dest.estacion;
      obs = x.cont.length ? "Continúa: " + x.cont.map(c => c.estacion).join(" · ") : "";
    } else if (view === "llegadas") {
      place = x.orig ? x.orig.estacion : "";
      const d = dwell(x.e);
      obs = d ? `Estaciona ${d} min` : "Parada breve";
    } else {
      place = `${x.a ? x.a.estacion : ""} → ${x.b ? x.b.estacion : ""}`;
      obs = "Sin parada";
    }
    return `<tr class="${view === "pasos" ? "paso" : ""}"><td class="t">${fmt(x.at)}</td><td class="dest">${place}</td>
      <td>${badge(x.t)}</td><td>${x.t.numero}</td><td class="via">${via}</td><td class="obs" title="${obs}">${obs}</td></tr>`;
  }).join("") : `<tr class="empty"><td colspan="6">Ningún tren ${view === "pasos" ? "pasa sin parar" : view === "salidas" ? "sale" : "llega"} por esta estación</td></tr>`;
  renderTrain(now);
}

function renderTrain(now) {
  const t = DATA.trenes.find(x => x.numero === trainSel);
  if (!t) { $("#it").innerHTML = ""; return; }
  // start the itinerary at the event the train is at, or heading to, now
  const ev = t.eventos;
  let start = 0, best = Infinity;
  ev.forEach((e, i) => { const d = nextAt(e.arr, now) - now; if (d < best) { best = d; start = i; } });
  const seq = ev.slice(start).concat(ev.slice(0, start));
  let clock = now;
  const lines = seq.map(e => {
    const arr = nextAt(e.arr, clock); clock = arr;
    const dep = e.tipo === "paso" ? arr : arr + dwell(e); clock = dep;
    return `<tr class="${e.tipo === "paso" ? "pas" : ""}"><td>${e.estacion}</td>
      <td>${e.tipo === "paso" ? "" : fmt(arr)}</td><td>${e.tipo === "paso" ? fmt(arr) : ""}</td>
      <td>${e.tipo === "paso" ? "" : fmt(dep)}</td><td>${e.via || ""}</td>
      <td>${e.tipo === "paso" ? "Paso" : (dwell(e) ? dwell(e) + " min" : "breve")}</td></tr>`;
  }).join("");
  $("#it").innerHTML = `<h2>${badge(t)} ${t.numero} · ${t.recorrido}</h2>
    <p class="note">${t.vmax} km/h · longitud máxima ${t.long_max_mm} mm · ciclo de ${CYCLE} min a partir de ahora</p>
    <table><thead><tr><th>Estación<small>STATION</small></th><th>Llega<small>ARR</small></th><th>Pasa<small>PASS</small></th>
    <th>Sale<small>DEP</small></th><th>Vía<small>TRACK</small></th><th>Parada<small>STOP</small></th></tr></thead>
    <tbody>${lines}</tbody></table>`;
}

// controls
const used = new Set(DATA.trenes.flatMap(t => t.eventos.map(e => e.estacion)));
$("#est").innerHTML = DATA.estaciones.filter(s => used.has(s)).map(s => `<option>${s}</option>`).join("");
$("#est").value = "Lora del Río";
$("#est").onchange = render;
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
$("#hora").onchange = e => { const [h, m] = e.target.value.split(":").map(Number); sim = isNaN(h) ? null : h * 60 + m; render(); };
$("#ahora").onclick = () => { sim = null; $("#hora").value = ""; render(); };
$("#legend").innerHTML = DATA.trenes.map(t => `<div class="leg" data-n="${t.numero}">
  <b class="n" style="background:${t.color};color:${textColor(t.color)}">${t.numero}</b>
  <span><b>${t.tipo}</b> ${t.recorrido} · ${t.vmax} km/h · ${t.long_max_mm} mm</span></div>`).join("");
document.querySelectorAll(".leg").forEach(l => l.onclick = () => {
  trainSel = Number(l.dataset.n); render(); $("#it").scrollIntoView({ behavior: "smooth" });
});
// optional URL parameters: ?est=Dos%20Hermanas&vista=llegadas&hora=09:30&tren=52
const q = new URLSearchParams(location.search);
if (q.get("est")) $("#est").value = q.get("est");
if (["salidas", "llegadas", "pasos"].includes(q.get("vista"))) view = q.get("vista");
if (/^\d\d:\d\d$/.test(q.get("hora") || "")) { $("#hora").value = q.get("hora"); const [h, m] = q.get("hora").split(":").map(Number); sim = h * 60 + m; }
if (q.get("tren")) trainSel = Number(q.get("tren"));
$("#note").innerHTML = `Malla <b>${DATA.encuentro}</b>: ciclo de ${CYCLE} minutos que se repite cada hora. ` +
  `Horarios sacados de la malla gráfica; las vías son las de la leyenda.`;
render();
setInterval(() => { if (sim === null) render(); }, 15000);
</script>
</body>
</html>
